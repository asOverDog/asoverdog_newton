[project]
name = "asoverdog-newton-demo"
version = "0.1.0"
description = "Source-checkout Newton/Kamino demo for AsOverDog robot-policy pairs"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
dependencies = [
  "newton[examples]==1.5.1",
  "numpy>=1.26",
  "torch>=2.5",
  "warp-nn[onnx]>=0.3,<0.4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: requires a working CUDA device", "slow: exercises solver construction"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
